services:
  particull:
    image: ghcr.io/au12/particull:latest
    build: .
    container_name: particull
    restart: unless-stopped
    ports:
      - "8097:8080"
    environment:
      PUID: "99"                 # Unraid's nobody:users
      PGID: "100"
      TZ: America/New_York
      PASSWORD: ""               # set one to require sign-in, e.g. when it's reachable from outside your LAN
      TRUST_PROXY: "true"        # behind Nginx Proxy Manager: use the real client address and https
    volumes:
      - /mnt/user/appdata/particull:/data
